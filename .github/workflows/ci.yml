name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Lint (flake8)
        run: flake8 src tests

      - name: Format check (black)
        run: black --check src tests

      - name: Tests (pytest + coverage)
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      # TODO Jalon 2 : `dvc pull` depuis DagsHub (secrets DAGSHUB_USER / DAGSHUB_TOKEN)
      #                puis `dvc repro` pour reproduire le pipeline.
      # TODO Jalon 2-3 : rapport CML (iterative/setup-cml) publiant MAE / RMSE / R²
      #                  vs persistance et le graphe réel vs prévu en commentaire de PR.
